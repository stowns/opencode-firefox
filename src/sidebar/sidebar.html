<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <div id="app">
    <header id="header">
      <div id="connection-status">
        <span id="status-dot"></span>
        <span id="status-text">Connecting...</span>
      </div>
      <div id="header-actions">
        <button id="btn-settings" title="Settings">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 10.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5z"/><path d="M14.5 7.5l-1.5-.2a5.5 5.5 0 00-.6-1.4l.9-1.2-1.4-1.4-1.2.9a5.5 5.5 0 00-1.4-.6L9 1.5h-2l-.2 1.5a5.5 5.5 0 00-1.4.6l-1.2-.9-1.4 1.4.9 1.2a5.5 5.5 0 00-.6 1.4L1.5 7.5v2l1.5.2a5.5 5.5 0 00.6 1.4l-.9 1.2 1.4 1.4 1.2-.9a5.5 5.5 0 001.4.6l.2 1.5h2l.2-1.5a5.5 5.5 0 001.4-.6l1.2.9 1.4-1.4-.9-1.2a5.5 5.5 0 00.6-1.4l1.5-.2v-2z"/></svg>
        </button>
      </div>
    </header>

    <div id="messages"></div>

    <div id="rag-panel" class="panel hidden">
      <div class="panel-header">
        <span>Index to Memory</span>
        <div class="rag-header-actions">
          <button id="btn-refresh-projects" title="Refresh projects">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M13.5 2.5a6.5 6.5 0 11-1.4 4h1.5a5 5 0 101.2-3.3L13.5 2.5zM13.5 2.5V5h-2.5"/></svg>
          </button>
          <button id="btn-rag-go" class="btn-primary">Go</button>
        </div>
      </div>
      <div id="rag-status" class="rag-status hidden"></div>
      <div id="projects-list"></div>
    </div>

    <div id="tab-context-panel" class="panel hidden">
      <div class="panel-header">
        <span>Tab Context</span>
        <button id="btn-refresh-tabs">Refresh</button>
      </div>
      <div id="tabs-list"></div>
    </div>

    <div id="input-area">
      <div id="tab-context-bar">
        <button id="btn-tabs" title="Add tab context">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M1 3h14v2H1V3zm0 4h14v2H1V7zm0 4h10v2H1v-2z"/></svg>
          <span id="tab-count">0 tabs selected</span>
        </button>
        <button id="btn-rag" title="Index tabs to project memory">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1l2 3h3l-2.5 2 1 3L8 7 4.5 9l1-3L3 4h3L8 1z"/><path d="M2 13h12v2H2v-2z"/></svg>
          <span>RAG it</span>
        </button>
      </div>
      <div id="input-row">
        <textarea id="prompt-input" placeholder="Ask OpenCode..." rows="1"></textarea>
        <button id="btn-send" disabled>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M2 2l12 6-12 6V9l7-1-7-1V2z"/></svg>
        </button>
      </div>
    </div>

    <div id="settings-panel" class="panel hidden">
      <div class="panel-header">
        <span>Settings</span>
      </div>
      <div id="settings-content">
        <div class="setting-row">
          <label for="setting-password">Server Password</label>
          <input type="password" id="setting-password" placeholder="OPENCODE_SERVER_PASSWORD">
        </div>
        <div class="setting-row">
          <label for="setting-username">Server Username</label>
          <input type="text" id="setting-username" placeholder="opencode" value="opencode">
        </div>
        <div class="setting-row">
          <label for="setting-url">Server URL</label>
          <input type="text" id="setting-url" placeholder="http://localhost:4096" value="http://localhost:4096">
        </div>
        <button id="btn-save-settings" class="btn-primary">Save</button>
      </div>
    </div>
  </div>

  <script src="../../node_modules/marked/marked.min.js"></script>
  <script src="sidebar.js"></script>
</body>
</html>
